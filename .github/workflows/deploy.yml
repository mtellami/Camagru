name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable development configuration
        run: |
          cp .env.example .env
          sed -i "s/GENERATE_ME/$(openssl rand -hex 32)/g" .env
      - run: docker compose --env-file .env -f docker/compose.dev.yaml config --quiet
      - run: docker compose --env-file .env -f docker/compose.dev.yaml up --build -d --wait
      - name: Check PHP and application health
        run: |
          docker compose --env-file .env -f docker/compose.dev.yaml exec -T web sh -c 'find src public -name "*.php" -exec php -l {} \;'
          curl --fail http://localhost:8080/health
      - if: always()
        run: docker compose --env-file .env -f docker/compose.dev.yaml down -v
