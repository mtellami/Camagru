name: camagru

services:
  web:
    image: ${WEB_IMAGE:-camagru:production}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: .env.production
    init: true
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    volumes:
      - media:/var/www/html/storage
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  media:
