[global]
error_log = /proc/self/fd/2
log_level = warning

[www]
listen = 127.0.0.1:9000
; Gallery thumbnails are served by PHP and browsers request several at once.
pm.max_children = 2
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500
access.log = /dev/null
clear_env = no
catch_workers_output = yes
security.limit_extensions = .php
