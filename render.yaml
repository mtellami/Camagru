services:
  - type: web
    name: camagru
    runtime: docker
    plan: free
    region: ohio
    repo: https://github.com/mtellami/camagru
    branch: main
    dockerfilePath: ./docker/Dockerfile
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: APP_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: AUTO_MIGRATE
        value: "1"
      - key: DB_HOST
        sync: false
      - key: DB_DIRECT_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: neondb
      - key: DB_USER
        value: neondb_owner
      - key: DB_PASSWORD
        sync: false
      - key: PGSSLMODE
        value: require
      - key: PGCHANNELBINDING
        value: require
      - key: SESSION_DRIVER
        value: pgsql
      - key: MEDIA_DRIVER
        value: pgsql
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_ENCRYPTION
        value: starttls
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: MAIL_FROM
        sync: false
